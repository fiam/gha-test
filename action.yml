name: GitHub Actions entrypoint probe
description: Patch later GitHub Actions entrypoints so they print before execution.
author: fiam

inputs:
  marker:
    description: Text printed before patched entrypoints.
    required: false
    default: "[gha-entrypoint-probe] before"
  install-shell-shims:
    description: Add PATH and Bash startup hooks for later run steps in the current job.
    required: false
    default: "true"
  patch-workspace:
    description: Patch local workflow and action files in GITHUB_WORKSPACE.
    required: false
    default: "true"
  patch-downloaded-actions:
    description: Patch action metadata already downloaded under RUNNER_WORKSPACE/_actions.
    required: false
    default: "true"
  github-token:
    description: Token used to fetch the current workflow when the workspace has not been checked out yet.
    required: false
    default: ""

runs:
  using: node24
  main: src/index.js

branding:
  icon: activity
  color: orange
