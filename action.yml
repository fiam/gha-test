name: GitHub Actions entrypoint probe
description: Patch later GitHub Actions entrypoints so they print before execution.
author: fiam

inputs:
  marker:
    description: Text printed before patched entrypoints.
    required: false
    default: "[gha-entrypoint-probe] before"
  install-shell-shims:
    description: Add PATH and Bash startup hooks for later run steps in the current job.
    required: false
    default: "true"
  patch-workspace:
    description: Patch local workflow and action files in GITHUB_WORKSPACE.
    required: false
    default: "true"
  patch-downloaded-actions:
    description: Patch action metadata already downloaded under RUNNER_WORKSPACE/_actions.
    required: false
    default: "true"
  github-token:
    description: Token used to fetch the current workflow when the workspace has not been checked out yet.
    required: false
    default: ""
  install-docker-wrapper:
    description: Replace /usr/bin/docker with a temporary wrapper on Linux hosted runners.
    required: false
    default: "true"
  setup-unprivileged-user:
    description: Create and prepare the unprivileged user before later entrypoints run.
    required: false
    default: "false"
  run-as-user:
    description: User that patched entrypoints should run as.
    required: false
    default: "unpriv"
  run-entrypoints-as-user:
    description: Re-exec patched shell, JavaScript, and Docker entrypoints as run-as-user.
    required: false
    default: "false"
  sandbox-enabled:
    description: Start an sbx sandbox and run patched shell, JavaScript, and Docker entrypoints through sbx exec.
    required: false
    default: "false"
  install-sbx-cli:
    description: Install sbx from docker/sbx-releases before creating the sandbox.
    required: false
    default: "true"
  sbx-deb-version:
    description: docker/sbx-releases tag used when installing sbx.
    required: false
    default: "v0.30.0"
  sandbox-template:
    description: Optional sbx template or image reference used for the shell sandbox.
    required: false
    default: ""
  sandbox-name:
    description: Optional explicit sbx sandbox name. Defaults to the current GitHub run/job.
    required: false
    default: ""
  sandbox-network-policy:
    description: sbx default network policy to set before sandbox creation.
    required: false
    default: "balanced"
  sandbox-work-root:
    description: Host path mounted into the sandbox. Defaults to the runner _work directory.
    required: false
    default: ""
  docker-username:
    description: Docker Hub username used for sbx image pulls when sandbox mode is enabled.
    required: false
    default: ""
  docker-password:
    description: Docker Hub password or token used for sbx image pulls when sandbox mode is enabled.
    required: false
    default: ""

runs:
  using: node24
  pre: src/pre.js
  main: src/index.js
  post: src/post.js
  post-if: always()

branding:
  icon: activity
  color: orange
